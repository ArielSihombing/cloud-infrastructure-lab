apiVersion: v1
kind: ConfigMap
metadata:
  name: fastapi-code
  namespace: cloud-lab
data:
  main.py: |
    from fastapi import FastAPI
    import socket
    import datetime

    app = FastAPI()

    @app.get("/health")
    def health():
        return {
            "status": "healthy",
            "hostname": socket.gethostname(),
            "version": "1.0.0-k8s",
            "timestamp": datetime.datetime.utcnow().isoformat()
        }

    @app.get("/api/status")
    def status():
        return {"service": "fastapi-k8s", "status": "running"}
